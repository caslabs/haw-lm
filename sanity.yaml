experiments:
  # Scratch Models
  - name: olelo-minibert
    model_type: bert
    model_name: olelo-minibert
    train_from_scratch: true
    search: true

    # ─── data configuration ──────────────────────────────
    corpus_data_name:  "kahupuke_dataset"     # ID of raw Hawaiian corpus
    corpus_data_clean: ["remove_numbers"]     # basic cleaning rules
    data_size:        0.01                    # use entire corpus
    pos_data_name:    "pos_dataset"           # POS-tagged subset
    train_split:      0.9
    seed:             1337

    # ─── tokenizer ────────────────────────────────────────
    tokenizer_type:    wordpiece    # choose:  wordpiece  |  byte_bpe
    tokenizer_output:  tokenizer/olelo-minibert
    vocab_size:        16000        # smaller vocab ⇒ higher token freq
    min_freq:          2
    character_coverage: 1.0         # keep ʻokina + macrons intact
    lowercase:         true
    max_length:        128

    # ─── model architecture (Mini-BERT) ─────────────────
    hidden_size:         256
    num_hidden_layers:   8
    num_attention_heads: 4
    intermediate_size:   1024
    max_position_embeddings: 128
    mlm_probability:     0.15

    # ─── pre-training hyper-parameters ──────────────────
    batch_size:        32
    total_epochs:      30
    learning_rate:     1.0e-4
    lr_scheduler:      linear_warmup_decay
    warmup_steps:      1000
    weight_decay:      0.01
    fp16:              true                  # leverages A6000 tensor cores
    logging_steps:     50
    evaluation_strategy: epoch
    #max_steps:         null                  # epochs, not steps, control runtime

    # ─── POS fine-tuning ────────────────────────────────
    ignore_label:      -100                  # mask sub-tokens in loss
    pos_batch_size:    32
    pos_learning_rate: 3.0e-5
    pos_num_epochs:    5
    pos_eval_strategy: epoch

    # ─── feature flags ──────────────────────────────────
    feature_flags:
      notifications: { discord_enabled: true }
      devtools:      { repl_enabled: false }
